<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskDeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%235c48e6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l5 5 9-10.5' fill='none' stroke='white' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script>
  try { const t = localStorage.getItem('td.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#5c48e6"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#lg)"/><path d="M9 16.5l5 5 9-10.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>TaskDeck</span>
  </div>

  <div class="seg" id="viewSwitch" role="tablist">
    <button data-view="board" role="tab" title="Board (B)"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v11h-4z"/></svg>Board</button>
    <button data-view="list" role="tab" title="List (L)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>List</button>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="search" type="search" placeholder="Search tasks and notes" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </label>

  <div class="spacer"></div>

  <button class="timer-pill" id="timerPill" hidden title="Stop the focus timer">
    <span class="pulse"></span><span id="timerTime">0:00</span><span class="timer-task" id="timerTask"></span>
    <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
  </button>

  <div class="stats" id="stats" title="Tasks completed over the last 7 days"></div>

  <button class="icon-btn" id="paletteBtn" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M12 17h7"/></svg></button>
  <button class="icon-btn" id="themeBtn" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</header>

<section class="quick">
  <div class="quick-box" id="quickBox">
    <svg class="quick-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <input id="quick" autocomplete="off" spellcheck="false"
      placeholder="Add a task…   try: Call Anna about the budget #finance !high @fri // https://link">
    <kbd class="quick-kbd">N</kbd>
  </div>
  <div class="quick-preview" id="quickPreview"></div>
</section>

<nav class="filters" id="filters"></nav>

<main id="view"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="palette" id="palette" hidden>
  <div class="palette-card">
    <input id="paletteInput" placeholder="Jump to a task or run a command…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="toasts" id="toasts"></div>
<canvas id="confetti"></canvas>

<script src="/md.js"></script>
<script src="/app.js"></script>
</body>
</html>
